name: Test production deployment event

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment (staging is excluded from DORA)"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      outcome:
        description: "Deployment outcome (success=DF/LT, failure/rollback=CFR)"
        required: true
        default: "success"
        type: choice
        options:
          - success
          - failure
          - rollback
      description:
        description: "Optional deployment description"
        required: false
        default: "M.A.N.T.A. DORA test deployment"
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  create-test-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Deployment and Deployment Status
        uses: actions/github-script@v7
        env:
          DEPLOY_ENV: ${{ inputs.environment || 'production' }}
          DEPLOY_OUTCOME: ${{ inputs.outcome || 'success' }}
          DEPLOY_DESC: ${{ inputs.description || 'M.A.N.T.A. DORA test deployment' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const envName = process.env.DEPLOY_ENV || "production";
            const outcome = process.env.DEPLOY_OUTCOME || "success";
            const customDesc = process.env.DEPLOY_DESC || "M.A.N.T.A. DORA test deployment";
            const isProd = envName === "production";

            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.sha,
              task: "deploy",
              auto_merge: false,
              required_contexts: [],
              environment: envName,
              description: customDesc,
              transient_environment: !isProd,
              production_environment: isProd
            });

            if (!deployment.data.id) {
              throw new Error("GitHub did not return a deployment ID.");
            }

            let statusState = "success";
            let statusDesc = "Test deployment completed successfully.";
            if (outcome === "failure") {
              statusState = "failure";
              statusDesc = "Test deployment failed (CFR validation).";
            } else if (outcome === "rollback") {
              statusState = "inactive";
              statusDesc = "Test deployment rolled back (rollback CFR validation).";
            }

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.data.id,
              state: statusState,
              environment: envName,
              description: statusDesc
            });

            core.info(
              `Created ${envName} deployment ${deployment.data.id} with outcome=${outcome} (state=${statusState}) for sha=${context.sha}`
            );
